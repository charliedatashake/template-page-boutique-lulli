<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Gabarit de page boutique, Lulli</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--ds-jaune:#FFFF7D;--ds-bleu:#DCEBFB;--ds-noir:#101010;--ds-gris:#E8E8E8}
*{margin:0;padding:0;box-sizing:border-box}
body{background:#F7F7F7;font-family:'Inter',-apple-system,sans-serif;color:var(--ds-noir)}
.bar{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid var(--ds-gris);padding:12px 16px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.bar h1{font-size:14px;font-weight:600}
.bar p{font-size:12px;color:rgba(16,16,16,.7)}
.legend{display:flex;gap:8px;font-size:11px;font-weight:600}
.legend span{padding:4px 8px;border:1px solid var(--ds-noir)}
.n{background:var(--ds-jaune)}.a{background:var(--ds-bleu)}
button{font:600 12px Inter,sans-serif;background:var(--ds-noir);color:#fff;border:0;padding:10px 16px;cursor:pointer}
.page{max-width:1440px;margin:0 auto}
.page img{display:block;width:100%;height:auto}
.hidden{display:none!important}
</style>
</head>
<body>
<div class="bar">
  <div>
    <h1>Gabarit de page boutique, Lulli Marseille 1er</h1>
    <p>Maquette de travail datashake, rendue avec les composants existants du site.</p>
  </div>
  <div class="legend"><span class="n">Nouveau</span><span class="a">Ajusté</span></div>
  <button id="t">Voir la page nue</button>
</div>
<div class="page">
  <img id="ann" src="img/annotee.jpg" alt="Page boutique Lulli Marseille 1er, version annotée">
  <img id="nue" class="hidden" src="img/nue.jpg" alt="Page boutique Lulli Marseille 1er, version nue">
</div>
<script>
const b=document.getElementById('t'),a=document.getElementById('ann'),n=document.getElementById('nue');
b.onclick=()=>{const s=a.classList.toggle('hidden');n.classList.toggle('hidden');b.textContent=s?'Voir la page annotée':'Voir la page nue';};
</script>
</body>
</html>
